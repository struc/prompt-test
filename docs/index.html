<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      #main {
        display: flex;
        flex-direction: row;
        gap: 1rem;
      }
      #main textarea {
        flex: 1;
        min-width: 40vw;
        min-height: 40vh;
        padding: 0.5rem 1rem;
      }
      .flex {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .gap-3 {
        gap: 3rem;
      }
      label {
        min-width: 20%;
      }
      pre {
        max-width: 90vw;
        white-space: break-spaces;
        font-size: 1.2rem;
        text-wrap: auto;
      }
    </style>
  </head>
  <body>
  <h2>Prompt Test</h2>
  <form id="form">
    <fieldset id="fieldset">
    <div id="main">
      <textarea id="system_prompt" placeholder="System"></textarea>
      <textarea id="message" placeholder="message"></textarea>
    </div>
    <div id="models-list" class="flex gap-2">
    </div>
    <div>
      <button type="submit">Submit</button>
    </div>
      </fieldset>
  </form>
  <pre id="response"></pre>
  <script>
    const form = document.getElementById('form');
    const modelsListElm = document.getElementById('models-list');
    let models = [];
    const fieldset = document.getElementById('fieldset');
    let API_ENDPOINT = localStorage.API_ENDPOINT;
    if(!API_ENDPOINT) {
      API_ENDPOINT = prompt('Enter API endpoint');
      if(API_ENDPOINT) {
        localStorage.API_ENDPOINT = API_ENDPOINT;
        fetchModels();
      }
    }
    if(localStorage.system_prompt) {
      form.elements.system_prompt.value = localStorage.system_prompt;
    }
    
    if(localStorage.message) {
      form.elements.message.value = localStorage.message;
    }
    
    const responseElm = document.getElementById('response');
    form.addEventListener('submit', async (e) => {
      fieldset.disabled = true;
      e.preventDefault();
      const systemPrompt = form.elements.system_prompt.value;
      const message = form.elements.message.value;
      localStorage.system_prompt = systemPrompt;
      localStorage.message = message;
      const req = await fetch(API_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({
          systemPrompt,
          message,
        }),
      });
      const resp = await req.json();
      responseElm.innerHTML = JSON.stringify(resp, null, 2);
      fieldset.disabled = false;
    });

    function setModels(models) {
      
      for(const m of models) {
        const mElm = document.createElement('label');
        mElm.innerHTML = `
        <input type="checkbox" name="${m}" />
                <span>${m}</span>
        `;
        modelsListElm.appendChild(mElm);
      }
    }
    
    async function fetchModels() {
      fetch(API_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({
          method: 'getModels',
        }),
      }).then(a => a.json())
      .then(setModels);
    }
  </script>
  </body>
</html>
